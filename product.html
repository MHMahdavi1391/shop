<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جزئیات خدمت - LTC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <a href="index.html" class="logo">
      <div class="logo-mark">LTC</div>
      <div class="logo-text">
        <strong>Lumen Technologies</strong>
        <span>خدمات دیجیتال حرفه‌ای</span>
      </div>
    </a>
    <nav class="nav">
      <a href="index.html#products">خدمات</a>
      <a href="tel:09362335266" class="btn-call">تماس</a>
    </nav>
  </div>
</header>

<main class="page-product">
  <div class="container">
    <a href="index.html" class="back-link">→ بازگشت به خدمات</a>
    <div id="product-detail">
      <div class="loading"><div class="spinner"></div>در حال بارگذاری...</div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <div class="copyright">© LTC — مدیریت: ۰۹۳۶۲۳۳۵۲۶۶</div>
  </div>
</footer>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var productId = new URLSearchParams(window.location.search).get('id');
  var box = document.getElementById('product-detail');

  function formatPrice(price) {
    if (price === '0' || price === 0) return 'رایگان';
    return Number(price).toLocaleString('fa-IR') + ' تومان';
  }

  function escapeHTML(str) {
    var d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  if (!productId) {
    box.innerHTML = '<div class="loading"><p>خدمتی یافت نشد</p><a class="btn btn-primary" href="index.html" style="margin-top:12px;display:inline-flex">بازگشت</a></div>';
    return;
  }

  fetch('products.json')
    .then(function (r) { return r.json(); })
    .then(function (products) {
      var product = products.find(function (p) { return String(p.id) === String(productId); });
      if (!product) throw new Error('not found');
      document.title = product.name + ' | LTC';
      render(product);
    })
    .catch(function () {
      box.innerHTML = '<div class="loading"><p>خطا در بارگذاری</p><a class="btn btn-primary" href="index.html" style="margin-top:12px;display:inline-flex">بازگشت</a></div>';
    });

  function render(product) {
    box.innerHTML =
      '<div class="detail-card">' +
        '<div class="detail-top">' +
          '<h1>' + escapeHTML(product.name) + '</h1>' +
          '<div class="price-pill">از ' + formatPrice(product.price) + '</div>' +
        '</div>' +
        '<div class="detail-body">' +
          '<div class="detail-image">' +
            '<img src="' + escapeHTML(product.image) + '" alt="' + escapeHTML(product.name) + '" onerror="this.style.opacity=0.3">' +
          '</div>' +
          '<div class="detail-info">' +
            '<h3>توضیحات</h3>' +
            '<p>' + escapeHTML(product.details) + '</p>' +
            '<div class="order-box">' +
              '<h3>ثبت سفارش</h3>' +
              '<form id="order-form">' +
                '<div class="form-group"><label for="name">نام و نام خانوادگی *</label>' +
                '<input class="form-control" id="name" name="name" required placeholder="نام کامل شما"></div>' +
                '<div class="form-group"><label for="phone">شماره تماس *</label>' +
                '<input class="form-control" id="phone" name="phone" type="tel" required placeholder="09xxxxxxxxx"></div>' +
                '<div class="form-group"><label for="details">جزئیات سفارش</label>' +
                '<textarea class="form-control" id="details" name="details" placeholder="توضیح نیاز و جزئیات پروژه..."></textarea></div>' +
                '<button type="submit" class="btn-submit" id="submit-btn">ثبت نهایی سفارش</button>' +
              '</form>' +
              '<div class="contact-row">' +
                '<a href="tel:09362335266">تماس تلفنی</a>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    var form = document.getElementById('order-form');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = document.getElementById('submit-btn');
      var name = document.getElementById('name').value.trim();
      var phone = document.getElementById('phone').value.trim();
      var details = document.getElementById('details').value.trim() || 'بدون توضیح';
      btn.disabled = true;
      btn.textContent = 'در حال ارسال...';

      var message = '📦 سفارش جدید\nمحصول: ' + product.name + '\nمشتری: ' + name + '\nتماس: ' + phone + '\nجزئیات: ' + details;
      var token = 'bot425913:7d5eec5b-c6c8-4bd9-9500-95e1d5a3bde4';
      var chat_id = 10977332;
      var url = 'https://eitaayar.ir/api/' + token + '/sendMessage?chat_id=' + chat_id + '&text=' + encodeURIComponent(message);

      var iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = url;
      document.body.appendChild(iframe);

      setTimeout(function () {
        try { document.body.removeChild(iframe); } catch (err) {}
        alert('✅ سفارش شما ثبت شد.\nبه‌زودی با شما تماس می‌گیریم.');
        form.reset();
        btn.disabled = false;
        btn.textContent = 'ثبت نهایی سفارش';
      }, 1500);
    });
  }
});
</script>
</body>
</html>
