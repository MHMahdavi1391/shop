<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظرسنجی - LTC</title>
  
  <!-- فونت -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  
  <style>
    /* استایل کلی */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Vazirmatn', 'Vazir', Tahoma, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      line-height: 1.6;
    }
    
    .survey-container {
      background: white;
      border-radius: 30px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.2);
      overflow: hidden;
      width: 100%;
      max-width: 800px;
      animation: slideUp 0.6s ease;
    }
    
    /* هدر */
    .survey-header {
      background: linear-gradient(135deg, #007aff 0%, #0056cc 100%);
      color: white;
      padding: 40px 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    
    .survey-header::before {
      content: '';
      position: absolute;
      top: -50px;
      right: -50px;
      width: 150px;
      height: 150px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
    }
    
    .survey-header::after {
      content: '';
      position: absolute;
      bottom: -30px;
      left: -30px;
      width: 100px;
      height: 100px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
    }
    
    .survey-title {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
    }
    
    .survey-subtitle {
      font-size: 18px;
      opacity: 0.9;
      position: relative;
      z-index: 1;
    }
    
    /* محتوای فرم */
    .survey-content {
      padding: 40px 30px;
    }
    
    .form-group {
      margin-bottom: 30px;
    }
    
    .form-label {
      display: block;
      margin-bottom: 12px;
      color: #1d1d1f;
      font-weight: 600;
      font-size: 17px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .form-label svg {
      color: #007aff;
      width: 20px;
      height: 20px;
    }
    
    .form-input {
      width: 100%;
      padding: 18px 20px;
      border: 2px solid #e0e0e0;
      border-radius: 15px;
      font-family: inherit;
      font-size: 16px;
      transition: all 0.3s ease;
      background: #f8f9fa;
    }
    
    .form-input:focus {
      border-color: #007aff;
      background: white;
      outline: none;
      box-shadow: 0 0 0 3px rgba(0,122,255,0.1);
    }
    
    textarea.form-input {
      min-height: 120px;
      resize: vertical;
    }
    
    /* امتیازدهی */
    .rating-section {
      text-align: center;
      margin: 40px 0;
    }
    
    .rating-title {
      font-size: 20px;
      margin-bottom: 25px;
      color: #1d1d1f;
      font-weight: 600;
    }
    
    .rating-stars {
      display: flex;
      justify-content: center;
      gap: 10px;
      direction: ltr;
    }
    
    .star-input {
      display: none;
    }
    
    .star-label {
      font-size: 40px;
      color: #ddd;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .star-label:hover,
    .star-label:hover ~ .star-label {
      color: #ffc107 !important;
    }
    
    .star-input:checked ~ .star-label {
      color: #ddd;
    }
    
    .star-input:checked + .star-label {
      color: #ffc107;
    }
    
    .rating-text {
      margin-top: 15px;
      color: #666;
      font-size: 14px;
    }
    
    /* دکمه‌ها */
    .form-actions {
      display: flex;
      gap: 20px;
      margin-top: 40px;
      flex-wrap: wrap;
    }
    
    .submit-btn {
      flex: 1;
      min-width: 200px;
      padding: 20px;
      background: linear-gradient(135deg, #34c759, #2aa44f);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 6px 20px rgba(52,199,89,0.2);
    }
    
    .submit-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(52,199,89,0.3);
    }
    
    .back-btn {
      flex: 1;
      min-width: 200px;
      padding: 20px;
      background: #f8f9fa;
      color: #555;
      border: 2px solid #e0e0e0;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .back-btn:hover {
      background: #e9ecef;
      border-color: #007aff;
      color: #007aff;
    }
    
    /* فوتر */
    .survey-footer {
      background: #f8f9fa;
      padding: 25px 30px;
      text-align: center;
      border-top: 2px solid #e9ecef;
    }
    
    .footer-text {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
    }
    
    .contact-link {
      color: #007aff;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }
    
    .contact-link:hover {
      color: #0056cc;
    }
    
    /* انیمیشن‌ها */
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    
    /* موبایل */
    @media (max-width: 768px) {
      body {
        padding: 15px;
      }
      
      .survey-container {
        border-radius: 25px;
      }
      
      .survey-header {
        padding: 30px 20px;
      }
      
      .survey-title {
        font-size: 28px;
      }
      
      .survey-subtitle {
        font-size: 16px;
      }
      
      .survey-content {
        padding: 30px 20px;
      }
      
      .form-label {
        font-size: 16px;
      }
      
      .form-input {
        padding: 16px;
      }
      
      .rating-title {
        font-size: 18px;
      }
      
      .star-label {
        font-size: 36px;
      }
      
      .submit-btn, .back-btn {
        min-width: 100%;
        padding: 18px;
        font-size: 16px;
      }
      
      .form-actions {
        gap: 15px;
      }
    }
    
    @media (max-width: 480px) {
      .survey-title {
        font-size: 24px;
      }
      
      .survey-header {
        padding: 25px 15px;
      }
      
      .survey-content {
        padding: 25px 15px;
      }
      
      .rating-stars {
        gap: 5px;
      }
      
      .star-label {
        font-size: 32px;
      }
    }
  </style>
</head>
<body>

<div class="survey-container">
  <!-- هدر -->
  <div class="survey-header">
    <h1 class="survey-title">نظرسنجی LTC</h1>
    <p class="survey-subtitle">نظرات شما برای بهبود کیفیت خدمات ضروری است</p>
  </div>
  
  <!-- فرم نظرسنجی -->
  <div class="survey-content">
    <form id="survey-form">
      <!-- نام -->
      <div class="form-group">
        <label class="form-label">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          نام و نام خانوادگی
        </label>
        <input type="text" name="name" class="form-input" placeholder="مثال: محمد حسین مهدوی" required>
      </div>
      
      <!-- شماره تماس -->
      <div class="form-group">
        <label class="form-label">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"></path>
          </svg>
          شماره تماس (اختیاری)
        </label>
        <input type="tel" name="phone" class="form-input" placeholder="مثال: ۰۹۳۶۲۳۳۵۲۶۶">
      </div>
      
      <!-- نظر -->
      <div class="form-group">
        <label class="form-label">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"></path>
          </svg>
          نظر، نقاط قوت و پیشنهادات
        </label>
        <textarea name="feedback" class="form-input" placeholder="نظرات و پیشنهادات خود را با ما در میان بگذارید..." required></textarea>
      </div>
      
      <!-- امتیازدهی -->
      <div class="rating-section">
        <div class="rating-title">به طور کلی از خدمات ما چقدر راضی بودید؟</div>
        
        <div class="rating-stars">
          <input type="radio" id="star5" name="rate" value="5" class="star-input" required>
          <label for="star5" class="star-label">★</label>
          
          <input type="radio" id="star4" name="rate" value="4" class="star-input">
          <label for="star4" class="star-label">★</label>
          
          <input type="radio" id="star3" name="rate" value="3" class="star-input">
          <label for="star3" class="star-label">★</label>
          
          <input type="radio" id="star2" name="rate" value="2" class="star-input">
          <label for="star2" class="star-label">★</label>
          
          <input type="radio" id="star1" name="rate" value="1" class="star-input">
          <label for="star1" class="star-label">★</label>
        </div>
        
        <div class="rating-text">
          <span id="rating-text">لطفاً امتیاز دهید</span>
        </div>
      </div>
      
      <!-- دکمه‌ها -->
      <div class="form-actions">
        <button type="submit" class="submit-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path>
          </svg>
          ارسال نظرسنجی
        </button>
        
        <a href="index.html" class="back-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"></path>
          </svg>
          بازگشت به سایت
        </a>
      </div>
    </form>
  </div>
  
  <!-- فوتر -->
  <div class="survey-footer">
    <p class="footer-text">با تشکر از مشارکت شما در بهبود کیفیت خدمات</p>
    <a href="tel:09362335266" class="contact-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"></path>
      </svg>
      تماس با مدیر: 09362335266
    </a>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const form = document.getElementById('survey-form');
  const ratingText = document.getElementById('rating-text');
  const stars = document.querySelectorAll('.star-input');
  
  // متن زیر ستاره‌ها
  const ratingMessages = {
    1: 'خیلی ضعیف - نیاز به بهبود جدی',
    2: 'ضعیف - نیاز به بهبود',
    3: 'متوسط - قابل قبول',
    4: 'خوب - راضی‌کننده',
    5: 'عالی - بسیار راضی'
  };
  
  // تغییر متن هنگام انتخاب ستاره
  stars.forEach(star => {
    star.addEventListener('change', function() {
      ratingText.textContent = ratingMessages[this.value];
      ratingText.style.color = '#34c759';
      ratingText.style.fontWeight = '600';
      ratingText.style.animation = 'pulse 0.5s ease';
      setTimeout(() => {
        ratingText.style.animation = '';
      }, 500);
    });
  });
  
  // ارسال فرم
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    
    // نمایش لودینگ
    const submitBtn = form.querySelector('.submit-btn');
    const originalHTML = submitBtn.innerHTML;
    submitBtn.innerHTML = `
      <div style="display: inline-block; width: 20px; height: 20px; border: 2px solid white; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      در حال ارسال...
    `;
    submitBtn.disabled = true;
    
    setTimeout(() => {
      const formData = new FormData(form);
      const name = formData.get('name');
      const phone = formData.get('phone') || 'ثبت نشده';
      const feedback = formData.get('feedback');
      const rate = formData.get('rate');
      
      // ایجاد پیام
      const message = `🌟 نظرسنجی \n\n`
        + `👤 نام: ${name}\n`
        + `📞 تماس: ${phone}\n`
        + `⭐ امتیاز: ${rate} از 5\n`
        + `📝 نظر: ${feedback}\n\n`
        + `⏰ زمان: ${new Date().toLocaleString('fa-IR')}`;
      
      // ارسال به تلگرام با iframe
      const token = 'bot425913:7d5eec5b-c6c8-4bd9-9500-95e1d5a3bde4';
      const chat_id = 10977332;
      const url = `https://eitaayar.ir/api/${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(message)}`;
      
      console.log('ارسال نظرسنجی به:', url);
      
      // روش iframe
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = url;
      document.body.appendChild(iframe);
      
      // بعد از ارسال
      setTimeout(() => {
        document.body.removeChild(iframe);
        
        // پیام موفقیت
        alert('✅ نظرسنجی شما با موفقیت ثبت شد!\n\nاز مشارکت شما صمیمانه سپاسگزاریم.');
        
        // ریست فرم
        form.reset();
        if (ratingText) {
          ratingText.textContent = 'لطفاً امتیاز دهید';
          ratingText.style.color = '#666';
          ratingText.style.fontWeight = 'normal';
        }
        
        // بازگشت دکمه
        submitBtn.innerHTML = originalHTML;
        submitBtn.disabled = false;
        
      }, 1500);
      
    }, 500);
  });
  
  // استایل برای اسپینر
  const style = document.createElement('style');
  style.textContent = `
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  `;
  document.head.appendChild(style);
});
</script>

</body>
</html>
